name: Testes do site

on:
  push:
    paths: ["site/**", "testes/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "testes/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: testes
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: testes/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
