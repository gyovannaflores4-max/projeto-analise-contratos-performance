name: Garimpo de editais (PNCP)

on:
  schedule:
    # Todo dia às 03h23 de Brasília: o Brasil inteiro leva 1 a 2 horas no PNCP
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garimpo
  cancel-in-progress: false

jobs:
  garimpar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alerta-csc/requirements.txt

      - run: pip install -r alerta-csc/requirements.txt

      - name: Procurar editais abertos com o perfil da equipe
        env:
          PORTAL_CHAVE_ROBO: ${{ secrets.PORTAL_CHAVE_ROBO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          # Vai só para este endereço.
          EMAIL_TO: gyovannaflores4@gmail.com
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: python -u alerta-csc/garimpo.py
