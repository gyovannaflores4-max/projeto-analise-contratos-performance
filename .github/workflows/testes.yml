name: Testes do portal e do robô

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portal-licitacoes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sintaxe dos arquivos JavaScript
        run: for f in assets/*.js api/*.js servidor-local.js testes/*.js; do node --check "$f" || exit 1; done

      - name: Leitura de editais (análise)
        run: node testes/analise.test.js

      - name: Comparação de objetos (suspensos)
        run: node testes/suspensos.test.js

      - name: Instalar o navegador de teste
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Todas as telas abrem sem erro
        run: node testes/telas.test.js

  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: alerta-csc/requirements.txt

      - run: pip install -r alerta-csc/requirements.txt

      - name: Sintaxe dos scripts
        run: python -m py_compile alerta-csc/*.py

      - name: Testes do robô (garimpo e resumo diário)
        run: python alerta-csc/testes_robo.py
