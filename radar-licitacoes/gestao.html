<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gestão de Prazos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Mesmo visual do Radar de Licitações: menu lateral, conteúdo em cartões e tabelas compactas. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#DDE3EB; --line-2:#C9D2DE;
  --ink:#101A2B; --ink-2:#4A586C; --ink-3:#738197;
  --accent:#1C5FD4; --accent-hover:#174FB3; --accent-ink:#FFFFFF; --accent-soft:#E7EEFC;
  --ok:#17804F; --ok-soft:#E2F4EA; --crit:#C0362C; --crit-soft:#FCE8E6; --warn:#9A5B00; --warn-soft:#FDF0D9;
  --shade:rgb(16 26 43 / .42);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --line:#273347; --line-2:#34435B;
    --ink:#E8EDF4; --ink-2:#AEB9C9; --ink-3:#8593A8;
    --accent:#6E9CF5; --accent-hover:#8BB0F8; --accent-ink:#0A1630; --accent-soft:#1B2B4A;
    --ok:#62CE96; --ok-soft:#133224; --crit:#FF8C82; --crit-soft:#46201D; --warn:#F1B65C; --warn-soft:#3F2E12;
    --shade:rgb(0 0 0 / .55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --line:#273347; --line-2:#34435B;
  --ink:#E8EDF4; --ink-2:#AEB9C9; --ink-3:#8593A8;
  --accent:#6E9CF5; --accent-hover:#8BB0F8; --accent-ink:#0A1630; --accent-soft:#1B2B4A;
  --ok:#62CE96; --ok-soft:#133224; --crit:#FF8C82; --crit-soft:#46201D; --warn:#F1B65C; --warn-soft:#3F2E12;
  --shade:rgb(0 0 0 / .55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.small{font-size:13px}

/* Estrutura */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--ink-3);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav a .c{margin-left:auto;font-size:12.5px;padding:0 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.nav a .c.crit{background:var(--crit-soft);color:var(--crit);font-weight:700}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink-2)}
.side-foot a{font-weight:600;text-decoration:none}
.side-foot button{appearance:none;border:0;background:none;padding:0;color:var(--ink-3);cursor:pointer;text-align:left;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1320px;margin-inline:auto;padding:28px clamp(16px,3vw,36px) 64px;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.page-h h1{font-size:clamp(22px,2.6vw,28px)}
.page-h p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.acts{display:flex;flex-wrap:wrap;gap:8px}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
.btn-sm{height:32px;padding:0 11px;font-size:13.5px}
.btn-danger{color:var(--crit)}
.btn-danger:hover{border-color:var(--crit);color:var(--crit)}
.link{appearance:none;border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:inherit}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span,.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.field small{font-size:12.5px;color:var(--ink-3);line-height:1.35}
.inp,.field input:not([type=checkbox]),.field select,.field textarea{width:100%;min-width:0;height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:14.5px}
.field textarea{height:auto;min-height:76px;padding:8px 10px;resize:vertical}
.inp:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;gap:9px;align-items:center;font-size:14.5px;cursor:pointer}
.check input{width:17px;height:17px;accent-color:var(--accent)}

/* Cartões, indicadores e listas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:16px}
.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit}
.kpi b{display:block;font-family:var(--f-display);font-size:28px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13.5px;color:var(--ink-2)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)}
@media (max-width:960px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{appearance:none;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink-2)}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .inp{max-width:320px}
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);font-size:14.5px}
.banner b{color:var(--warn)}
.banner.info{background:var(--accent-soft)} .banner.info b{color:var(--accent)}

.ev{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:6px 18px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.due{display:flex;flex-direction:column;align-items:center;justify-content:center;height:62px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.due b{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.due span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.n-vencido .due,.due.vencido{background:var(--crit);color:#fff}
.n-urgente .due,.due.urgente{background:var(--crit-soft);color:var(--crit)}
.n-atencao .due,.due.atencao{background:var(--warn-soft);color:var(--warn)}
.ev-top{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-3)}
.tag{display:inline-block;padding:0 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.tag.contrato{background:var(--accent-soft);color:var(--accent)}
.tag.documento{background:var(--ok-soft);color:var(--ok)}
.tag.licitacao{background:var(--warn-soft);color:var(--warn)}
.ev-t{font-weight:600;overflow-wrap:anywhere}
.ev-d{color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
.ev-a{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:720px){.ev{grid-template-columns:62px minmax(0,1fr)}.ev-a{grid-column:1/-1;justify-content:flex-start}}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}

/* Tabelas */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:1.4}
.tbl th{background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
.tbl tbody tr[data-abrir]{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr[data-abrir]:hover td{background:var(--surface-2)}
.tbl .t1{font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.tbl .t2{font-size:12.5px;color:var(--ink-3);overflow-wrap:anywhere}
.tbl .r{text-align:right}
.pill{display:inline-block;white-space:nowrap;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pill.vencido{background:var(--crit);color:#fff}
.pill.urgente{background:var(--crit-soft);color:var(--crit)}
.pill.atencao{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:none;color:var(--ink-3);font-weight:500}
.dt b{display:block;color:var(--ink);font-weight:600;white-space:nowrap}
@media (max-width:860px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;padding:14px;border-bottom:1px solid var(--line)}
  .tbl td{padding:0;border:0;min-width:0}
  .tbl td:first-child{grid-column:1/-1}
  .tbl .r{text-align:left}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
}

/* Detalhe da licitação */
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
.lista{list-style:none;margin:0;padding:0}
.lista>li{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--line)}
.lista>li:last-child{border-bottom:0}
.lista .grow{flex:1 1 auto;min-width:0}
.lista .t{font-weight:600;overflow-wrap:anywhere}
.lista .s{font-size:13px;color:var(--ink-3)}
.lista input[type=checkbox]{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.feito .t{text-decoration:line-through;color:var(--ink-3)}
.msg{white-space:pre-wrap;font-size:14px;color:var(--ink-2);overflow-wrap:anywhere;max-height:220px;overflow:auto}
.msg-nova .t::after{content:"nova";margin-left:8px;padding:0 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;vertical-align:2px}
.tl{list-style:none;margin:0;padding:6px 18px 14px;max-height:460px;overflow:auto}
.tl li{position:relative;padding:8px 0 8px 22px;border-left:2px solid var(--line);font-size:14px}
.tl li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.tl li.pncp::before{background:var(--accent)} .tl li.mensagem::before{background:var(--warn)} .tl li.status::before{background:var(--ok)}
.tl time{display:block;font-size:12px;color:var(--ink-3)}

/* Lances */
.lance-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.lance-box{grid-template-columns:minmax(0,1fr)}}
.sug{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r);background:var(--surface-2)}
.sug b{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.sug.cobrir{background:var(--accent-soft)} .sug.cobrir b{color:var(--accent)}
.sug.manter{background:var(--ok-soft)} .sug.manter b{color:var(--ok)}
.sug.parar{background:var(--crit-soft)} .sug.parar b{color:var(--crit)}
.sug.intermediario{background:var(--warn-soft)} .sug.intermediario b{color:var(--warn)}
.relogio{font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.relogio.fim{color:var(--crit)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}

/* Formulário em janela */
dialog{width:min(760px,calc(100% - 24px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);box-shadow:0 24px 64px rgb(0 0 0 / .25)}
dialog::backdrop{background:var(--shade)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:18px}
.dlg-b{padding:16px 20px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.dlg-b .wide,.dlg-b h3,.dlg-b .nota{grid-column:1/-1}
.dlg-b h3{font-size:14px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.dlg-b h3:first-child{margin-top:0;padding-top:0;border-top:0}
.nota{font-size:13.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.dlg-f .esq{margin-right:auto}
@media (max-width:640px){.dlg-b{grid-template-columns:minmax(0,1fr)}}
.x{appearance:none;width:36px;height:36px;border:0;border-radius:8px;background:none;cursor:pointer;font-size:22px;color:var(--ink-3)}
.x:hover{background:var(--surface-2)}

/* Entrada */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.login h1{font-size:22px}
.err{color:var(--crit);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:min(560px,calc(100% - 32px));padding:12px 18px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:14.5px;box-shadow:0 12px 32px rgb(0 0 0 / .25)}
.toast.erro{background:var(--crit);color:#fff}

@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .logo small,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 auto;min-width:0}
  .nav a{width:auto;white-space:nowrap}
}
</style>
</head>
<body>

<div class="login" id="login" hidden>
  <form id="formLogin">
    <h1>Gestão de Prazos</h1>
    <p class="muted">Contratos, certidões e licitações em um só lugar. Entre com a senha da equipe.</p>
    <label class="field"><span>Senha</span><input type="password" id="senha" autocomplete="current-password" required></label>
    <label class="check"><input type="checkbox" id="lembrar" checked> Lembrar neste computador</label>
    <p class="err" id="loginErro" hidden></p>
    <button class="btn btn-primary" type="submit">Entrar</button>
    <a class="small" href="./">Ir para o Radar de Licitações</a>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <rect x="8" y="9" width="16" height="15" rx="2.5" fill="none" stroke="var(--accent-ink)" stroke-width="1.8"/>
        <path d="M8 13.5h16M12 7v4M20 7v4" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12.5 18.5l2.3 2.2 4.7-4.6" fill="none" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>Gestão de Prazos<small>Contratos e licitações</small></div>
    </div>
    <nav class="nav" aria-label="Menu" id="nav">
      <a href="#painel" data-v="painel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6zM10 19a2 2 0 0 0 4 0"/></svg>Alertas<span class="c num" id="cAlertas">0</span></a>
      <a href="#contratos" data-v="contratos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg>Contratos<span class="c num" id="cContratos">0</span></a>
      <a href="#documentos" data-v="documentos"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="9" r="5"/><path d="m9 13-2 8 5-3 5 3-2-8"/></svg>Documentos<span class="c num" id="cDocumentos">0</span></a>
      <a href="#licitacoes" data-v="licitacoes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21h16M6 21V10M18 21V10M10 21V10M14 21V10M3 10l9-6 9 6z"/></svg>Licitações<span class="c num" id="cLicitacoes">0</span></a>
      <a href="#lances" data-v="lances"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15l4-4 3 3 6-7"/></svg>Lances</a>
      <a href="#config" data-v="config"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Configurações</a>
    </nav>

      <a href="./">← Radar de Licitações</a>
      <span id="sideStatus" class="muted"></span>

  <div class="main"><main class="content" id="conteudo" tabindex="-1"></main></div>
</div>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog" novalidate></form></dialog>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="arquivo" accept=".csv,.xlsx,.xls,.ods,text/csv" hidden>

<script src="regras.js"></script>
<script>
"use strict";
const R = window.Regras;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const S = { dados: null, senha: "", filtro: { grupo: "todos", horizonte: 120, busca: "", situacao: "ativas" }, lance: {} };

/* ---------- Armazenamento local (só conveniências) ---------- */
function local(k, v) {
  try {
    if (v === undefined) return JSON.parse(localStorage.getItem("gp-" + k) || "null");
    if (v === null) localStorage.removeItem("gp-" + k); else localStorage.setItem("gp-" + k, JSON.stringify(v));
  } catch { return null; }
}
function lerSenha() { try { return localStorage.getItem("gp-senha-v") || sessionStorage.getItem("gp-senha-v") || ""; } catch { return S.senha; } }
function guardarSenha(s, lembrar) {
  S.senha = s;
  try { localStorage.removeItem("gp-senha-v"); sessionStorage.removeItem("gp-senha-v"); (lembrar ? localStorage : sessionStorage).setItem("gp-senha-v", s); } catch {}
}

/* ---------- Comunicação com o servidor ---------- */
async function api(caminho, corpo) {
  const r = await fetch(caminho, {
    method: corpo ? "POST" : "GET",
    headers: { "x-senha": S.senha, "content-type": "application/json" },
    body: corpo ? JSON.stringify(corpo) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 || r.status === 503) { mostrarLogin(j.erro); throw new Error(j.erro || "Acesso negado."); }
  if (!r.ok) throw new Error(j.erro || "O servidor respondeu " + r.status + ".");
  return j;
}
async function carregar() {
  S.dados = await api("api/dados");
  $("#login").hidden = true; $("#app").hidden = false;
  render();
}
async function salvar(colecao, item, msg) {
  const { item: salvo } = await api("api/dados", { acao: "salvar", colecao, item });
  const lista = S.dados[colecao], i = lista.findIndex(x => x.id === salvo.id);
  if (i >= 0) lista[i] = salvo; else lista.push(salvo);
  if (msg) aviso(msg);
  render();
  return salvo;
}
async function remover(colecao, id) {
  await api("api/dados", { acao: "remover", colecao, id });
  S.dados[colecao] = S.dados[colecao].filter(x => x.id !== id);
  aviso("Excluído.");
  render();
}

let tToast;
function aviso(texto, erro) {
  const t = $("#toast"); t.textContent = texto; t.className = "toast" + (erro ? " erro" : ""); t.hidden = false;
  clearTimeout(tToast); tToast = setTimeout(() => (t.hidden = true), erro ? 7000 : 3500);
}
const tentar = fn => async (...a) => { try { return await fn(...a); } catch (e) { aviso(e.message || String(e), true); } };

function mostrarLogin(msg) {
  $("#app").hidden = true; $("#login").hidden = false;
  const e = $("#loginErro"); e.hidden = !msg; e.textContent = msg || "";
  $("#senha").focus();
}

/* ---------- Formatação ---------- */
const fData = s => (s ? R.formatarData(s) : "—");
const pct = n => String(n).replace(".", ",") + "%";
const hoje = () => R.hojeBrasilia();
function pillDias(data, unidade = "dias", sem = "—") {
  if (!data) return '<span class="pill off">' + sem + "</span>";
  const ev = { data, unidade, avisos: [] }, a = R.avaliar(ev, Date.now());
  return '<span class="pill ' + a.nivel + '">' + esc(R.textoFalta(ev, a)) + "</span>";
}
function caixaPrazo(ev, a) {
  if (ev.unidade === "horas") {
    if (a.vencido) return '<div class="due"><b>!</b><span>venceu</span></div>';
    return a.falta < 48 ? '<div class="due"><b>' + Math.max(0, Math.floor(a.falta)) + '</b><span>horas</span></div>' : '<div class="due"><b>' + Math.floor(a.falta / 24) + "</b><span>dias</span></div>";
  }
  if (a.falta === 0) return '<div class="due"><b>0</b><span>hoje</span></div>';
  if (a.vencido) return '<div class="due"><b>' + -a.falta + '</b><span>atraso</span></div>';
  return '<div class="due"><b>' + a.falta + "</b><span>" + (a.falta === 1 ? "dia" : "dias") + "</span></div>";
}
const NOME_GRUPO = { contrato: "Contrato", documento: "Documento", licitacao: "Licitação" };

/* ---------- Navegação ---------- */
function rota() { const h = location.hash.replace(/^#/, "") || "painel"; const [v, id] = h.split("/"); return { v, id }; }
window.addEventListener("hashchange", () => { render(); $("#conteudo").focus({ preventScroll: true }); window.scrollTo(0, 0); });

function render() {
  if (!S.dados) return;
  const { v, id } = rota();
  const ativo = v === "licitacao" ? "licitacoes" : v;
  for (const a of document.querySelectorAll("#nav a")) { if (a.dataset.v === ativo) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); }
  contadores();
  const telas = { painel: telaPainel, contratos: telaContratos, documentos: telaDocumentos, licitacoes: telaLicitacoes, licitacao: () => telaLicitacao(id), lances: telaLances, config: telaConfig };
  (telas[v] || telaPainel)();
}
function contadores() {
  const agora = Date.now(), evs = R.eventos(S.dados, hoje()).map(ev => R.avaliar(ev, agora));
  const urg = evs.filter(a => a.nivel === "vencido" || a.nivel === "urgente").length;
  const c = $("#cAlertas"); c.textContent = urg; c.classList.toggle("crit", urg > 0);
  $("#cContratos").textContent = S.dados.contratos.filter(c => c.situacao !== "encerrado").length;
  $("#cDocumentos").textContent = S.dados.documentos.filter(d => d.situacao !== "substituido").length;
  $("#cLicitacoes").textContent = S.dados.licitacoes.filter(l => R.statusLicitacao(l.status).ativa).length;
  const srv = S.dados.servidor || {};
  $("#sideStatus").textContent = srv.armazenamento === "memoria" ? "⚠ Dados temporários (configure o Upstash)" : "Dados salvos no servidor";
}

/* ---------- Tela: alertas ---------- */
function telaPainel() {
  const agora = Date.now(), f = S.filtro;
  const todos = R.eventos(S.dados, hoje()).map(ev => ({ ev, a: R.avaliar(ev, agora) }));
  const dias = x => (x.ev.unidade === "horas" ? x.a.falta / 24 : x.a.falta);
  const lista = todos
    .filter(x => (x.a.vencido ? dias(x) >= -120 : dias(x) <= f.horizonte))
    .filter(x => f.grupo === "todos" || x.ev.grupo === f.grupo)
    .sort((x, y) => dias(x) - dias(y));
  const k = {
    vencidos: todos.filter(x => x.a.vencido).length,
    d7: todos.filter(x => !x.a.vencido && dias(x) <= 7).length,
    d30: todos.filter(x => !x.a.vencido && dias(x) <= 30).length,
    lic: S.dados.licitacoes.filter(l => R.statusLicitacao(l.status).ativa).length,
    msgs: S.dados.licitacoes.reduce((n, l) => n + (l.mensagens || []).filter(m => !m.lida).length, 0) + S.dados.caixa.length
  };
  const srv = S.dados.servidor || {}, canais = srv.canais || {};
  const avisosLigados = (canais.email && S.dados.config.emails) || (canais.telegram && S.dados.config.telegramChatId);
  const vazio = !S.dados.contratos.length && !S.dados.documentos.length && !S.dados.licitacoes.length;
  $("#conteudo").innerHTML = `
    <header class="page-h">
      <div><h1>Alertas e prazos</h1><p>Vencimentos de contratos, renovação, reajuste, certidões e prazos das licitações, do mais urgente para o mais distante.</p></div>
      <div class="acts">
        <button class="btn" data-acao="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Baixar agenda</button>
        <button class="btn btn-primary" data-acao="rotina"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>Verificar agora</button>
      </div>
    </header>
    ${srv.armazenamento === "memoria" ? '<div class="banner"><div><b>Os dados ainda não estão sendo guardados.</b> Ligue o banco gratuito do Upstash na Vercel (passo 2 do guia em Configurações). Até lá, tudo some quando o servidor reinicia.</div></div>' : ""}
    ${!avisosLigados ? '<div class="banner info"><div><b>Os avisos automáticos ainda não estão ligados.</b> Cadastre os e-mails da equipe ou o Telegram em <a href="#config">Configurações</a>. Enquanto isso, os prazos aparecem aqui e na agenda.</div></div>' : ""}
    <section class="kpis">
      <a class="kpi ${k.vencidos ? "crit" : ""}" href="#painel"><b>${k.vencidos}</b><span>vencidos</span></a>
      <a class="kpi ${k.d7 ? "crit" : ""}" href="#painel"><b>${k.d7}</b><span>nos próximos 7 dias</span></a>
      <a class="kpi ${k.d30 ? "warn" : ""}" href="#painel"><b>${k.d30}</b><span>nos próximos 30 dias</span></a>
      <a class="kpi" href="#licitacoes"><b>${k.lic}</b><span>licitações em andamento</span></a>
      <a class="kpi ${k.msgs ? "warn" : ""}" href="#licitacoes"><b>${k.msgs}</b><span>mensagens não lidas</span></a>
    </section>
    ${S.dados.caixa.length ? caixaEntrada() : ""}
    <section class="card">
      <div class="card-h">
        <div class="chips" role="group" aria-label="Filtrar">
          ${[["todos", "Todos"], ["contrato", "Contratos"], ["documento", "Documentos"], ["licitacao", "Licitações"]].map(([v, n]) => `<button class="chip" data-grupo="${v}" aria-pressed="${f.grupo === v}">${n}</button>`).join("")}
        </div>
        <label class="small muted">Mostrar até <select class="inp" style="width:auto;height:32px;display:inline-block" id="horizonte">${[30, 60, 120, 365].map(d => `<option value="${d}" ${f.horizonte === d ? "selected" : ""}>${d} dias</option>`).join("")}</select></label>
      </div>
      <div>${lista.length ? lista.map(linhaEvento).join("") : vazio
        ? '<div class="empty"><b>Nada cadastrado ainda</b>Comece importando suas planilhas em <a href="#contratos">Contratos</a>, <a href="#documentos">Documentos</a> e <a href="#licitacoes">Licitações</a>.</div>'
        : '<div class="empty"><b>Nenhum prazo neste período</b>Aumente o período ou troque o filtro.</div>'}</div>
    </section>`;
}
function linhaEvento({ ev, a }) {
  const acoes = [];
  if (ev.tipo === "renovacao") acoes.push(`<button class="btn btn-sm" data-acao="feito-renov" data-id="${ev.refId}">Renovação pedida</button>`);
  if (ev.tipo === "reajuste") acoes.push(`<button class="btn btn-sm" data-acao="feito-reaj" data-id="${ev.refId}" data-aniv="${ev.aniversario}">Reajuste pedido</button>`);
  if (ev.tipo === "documento") acoes.push(`<button class="btn btn-sm" data-acao="renovar-doc" data-id="${ev.refId}">Renovar</button>`);
  if (ev.tipo === "prazo") acoes.push(`<button class="btn btn-sm" data-acao="feito-prazo" data-id="${ev.refId}" data-p="${ev.chave.split(":p:")[1]}">Feito</button>`);
  const destino = ev.grupo === "contrato" ? "contratos" : ev.grupo === "documento" ? "documentos" : "licitacao";
  acoes.push(`<button class="btn btn-sm" data-acao="abrir" data-col="${destino}" data-id="${ev.refId}">Abrir</button>`);
  return `<div class="ev n-${a.nivel}">
    ${caixaPrazo(ev, a)}
    <div style="min-width:0">
      <div class="ev-top"><span class="tag ${ev.grupo}">${NOME_GRUPO[ev.grupo]}</span><span>${esc(R.dataDoEvento(ev))} (${R.diaSemana(ev.data.slice(0, 10))})</span>${ev.responsavel ? `<span>Resp.: ${esc(ev.responsavel)}</span>` : ""}</div>
      <div class="ev-t">${esc(ev.descricao)}</div>
      <div class="ev-d">${esc(ev.titulo)}${ev.nota ? " · " + esc(ev.nota) : ""}</div>
    </div>
    <div class="ev-a">${acoes.join("")}</div>
  </div>`;
}
function caixaEntrada() {
  const ativas = S.dados.licitacoes.filter(l => R.statusLicitacao(l.status).ativa);
  const opcoes = ativas.map(l => `<option value="${l.id}">${esc(R.rotuloLicitacao(l).slice(0, 90))}</option>`).join("");
  return `<section class="card">
    <div class="card-h"><h2>Mensagens sem licitação ligada (${S.dados.caixa.length})</h2><span class="small muted">Chegaram dos portais, mas não reconheci de qual licitação são.</span></div>
    <ul class="lista">${S.dados.caixa.map(m => `<li>
      <div class="grow"><div class="t">${esc(m.assunto || m.nomeClasse)}</div><div class="s">${esc(fData(m.em))} · ${esc(m.de || m.fonte)} · ${esc(m.nomeClasse)}</div><div class="msg">${esc(m.texto.slice(0, 600))}</div></div>
      <div class="acts" style="flex-direction:column;align-items:stretch;min-width:200px">
        <select class="inp" data-ligar-sel="${m.id}"><option value="">Escolha a licitação…</option>${opcoes}</select>
        <div class="acts"><button class="btn btn-sm" data-acao="caixa-ligar" data-id="${m.id}">Ligar</button><button class="btn btn-sm btn-danger" data-acao="caixa-descartar" data-id="${m.id}">Descartar</button></div>
      </div></li>`).join("")}</ul></section>`;
}

/* ---------- Tela: contratos ---------- */
const CAMPOS_CONTRATO = [
  { secao: "Contrato" },
  { k: "numero", r: "Nº do contrato", req: true },
  { k: "cliente", r: "Cliente / órgão", req: true },
  { k: "objeto", r: "Objeto", t: "textarea", wide: true },
  { k: "inicio", r: "Início da vigência", t: "date" },
  { k: "fim", r: "Vencimento (fim da vigência)", t: "date", req: true },
  { k: "valor", r: "Valor (R$)", t: "number" },
  { k: "situacao", r: "Situação", t: "select", ops: [["vigente", "Vigente"], ["encerrado", "Encerrado (para de avisar)"]] },
  { k: "responsavel", r: "Responsável" },
  { k: "emails", r: "E-mails que recebem os avisos deste contrato", dica: "Além da lista geral da equipe. Separe por vírgula." },
  { k: "avisosVencimento", r: "Avisar quantos dias antes do vencimento", dica: () => "Padrão: " + avisosPadrao("vencimento") },
  { secao: "Renovação (prorrogação)" },
  { k: "renovacaoDiasAntes", r: "Pedir a renovação quantos dias antes do vencimento", t: "number", dica: "Ex.: 90. Confira a cláusula de prorrogação do contrato." },
  { k: "renovacaoData", r: "…ou data exata para pedir", t: "date", dica: "Se preenchida, vale esta data." },
  { k: "naoRenovavel", r: "Este contrato não pode ser renovado", t: "check", wide: true },
  { k: "avisosRenovacao", r: "Avisar quantos dias antes do prazo de renovação", dica: () => "Padrão: " + avisosPadrao("renovacao") },
  { k: "renovacaoSolicitadaPara", t: "hidden" },
  { secao: "Reajuste" },
  { k: "reajusteDataBase", r: "Data-base do reajuste", t: "date", dica: "Data do orçamento/proposta ou do último reajuste. O pedido é anual a partir dela." },
  { k: "reajustePeriodicidade", r: "Periodicidade (meses)", t: "number", ph: "12" },
  { k: "reajusteDiasApos", r: "Prazo para pedir: dias depois do aniversário", t: "number", ph: "0", dica: "0 = no próprio aniversário. Atenção: o pedido costuma precisar ser feito antes da assinatura da prorrogação." },
  { k: "reajusteIndice", r: "Índice", ph: "IPCA, IGP-M, INPC, convenção coletiva…" },
  { k: "reajusteData", r: "…ou data exata para pedir", t: "date", dica: "Se preenchida, vale esta data." },
  { k: "avisosReajuste", r: "Avisar quantos dias antes do prazo de reajuste", dica: () => "Padrão: " + avisosPadrao("reajuste") },
  { k: "reajusteSolicitadoPara", t: "hidden" },
  { secao: "Outros" },
  { k: "obs", r: "Observações", t: "textarea", wide: true }
];
function avisosPadrao(k) { return R.lerAvisos((S.dados.config.avisos || {})[k], R.AVISOS_PADRAO[k]).join(", "); }
function previaContrato(v) {
  const partes = [];
  if (v.fim) partes.push("Vencimento " + fData(v.fim));
  const ren = R.prazoRenovacao(v); if (ren) partes.push("pedir renovação até " + fData(ren));
  const rea = R.prazoReajuste({ ...v, reajusteSolicitadoPara: "" }, hoje()); if (rea) partes.push("pedir reajuste até " + fData(rea.prazo));
  return partes.length ? "Prazos calculados: " + partes.join(" · ") + "." : "Preencha o vencimento para calcular os prazos.";
}
function abrirContrato(c) {
  formulario({
    titulo: c ? "Contrato " + (c.numero || "") : "Novo contrato", campos: CAMPOS_CONTRATO, valores: c || { situacao: "vigente" }, previa: previaContrato,
    salvar: v => salvar("contratos", { ...c, ...v }, "Contrato salvo."),
    excluir: c && (() => remover("contratos", c.id))
  });
}
function telaContratos() {
  const b = R.semAcento(S.filtro.busca), agora = Date.now(), h = hoje();
  const lista = S.dados.contratos
    .filter(c => S.filtro.situacao === "todas" || (S.filtro.situacao === "ativas" ? c.situacao !== "encerrado" : c.situacao === "encerrado"))
    .filter(c => !b || R.semAcento([c.numero, c.cliente, c.objeto, c.responsavel].join(" ")).includes(b))
    .sort((x, y) => String(x.fim || "9").localeCompare(String(y.fim || "9")));
  $("#conteudo").innerHTML = `
    <header class="page-h">
      <div><h1>Contratos</h1><p>Vencimento, prazo para pedir a renovação e prazo para pedir o reajuste de cada contrato.</p></div>
      <div class="acts">
        <button class="btn" data-acao="importar" data-col="contratos">Importar planilha</button>
        <button class="btn" data-acao="exportar" data-col="contratos">Exportar</button>
        <button class="btn btn-primary" data-acao="novo" data-col="contratos">Novo contrato</button>
      </div>
    </header>
    ${filtrosLista([["ativas", "Vigentes"], ["encerradas", "Encerrados"], ["todas", "Todos"]], "Buscar contrato, cliente, objeto…")}
    <section class="card tbl-wrap">${lista.length ? `<table class="tbl"><thead><tr><th>Contrato</th><th>Vencimento</th><th>Pedir renovação até</th><th>Pedir reajuste até</th><th class="r">Valor</th><th>Responsável</th></tr></thead><tbody>
      ${lista.map(c => {
        const ren = c.renovacaoSolicitadaPara === c.fim ? null : R.prazoRenovacao(c), rea = R.prazoReajuste(c, h);
        return `<tr data-abrir="contratos" data-id="${c.id}">
          <td><div class="t1">${esc(c.numero || "—")} · ${esc(c.cliente || "")}</div><div class="t2">${esc((c.objeto || "").slice(0, 110))}</div></td>
          <td data-l="Vencimento" class="dt"><b>${fData(c.fim)}</b>${c.situacao === "encerrado" ? '<span class="pill off">encerrado</span>' : pillDias(c.fim)}</td>
          <td data-l="Renovação" class="dt">${c.naoRenovavel ? '<span class="pill off">não renovável</span>' : c.renovacaoSolicitadaPara === c.fim ? '<span class="pill ok">pedida</span>' : ren ? "<b>" + fData(ren) + "</b>" + pillDias(ren) : '<span class="pill off">não informado</span>'}</td>
          <td data-l="Reajuste" class="dt">${rea ? "<b>" + fData(rea.prazo) + "</b>" + pillDias(rea.prazo) + (c.reajusteIndice ? ' <span class="t2">' + esc(c.reajusteIndice) + "</span>" : "") : '<span class="pill off">não informado</span>'}</td>
          <td data-l="Valor" class="r num">${c.valor ? R.moeda(c.valor) : "—"}</td>
          <td data-l="Responsável">${esc(c.responsavel || "—")}</td></tr>`;
      }).join("")}</tbody></table>` : vazioLista("contrato", "contratos")}</section>`;
}
function filtrosLista(ops, ph) {
  return `<div class="toolbar">

function previaDocumento(v, ultimo, form) {
  const t = R.tipoDocumento(v.tipo);
  if (ultimo === "tipo" && form) { const nome = form.elements.nome; if (!nome.value || R.TIPOS_DOCUMENTO.some(x => x.nome === nome.value)) nome.value = t.nome; }
  if ((ultimo === "emissao" || ultimo === "tipo") && form && v.emissao && t.validadeDias && !form.elements.validade.dataset.mexido) form.elements.validade.value = R.somaDias(v.emissao, t.validadeDias);
  return (t.validadeDias ? "Validade típica de " + t.nome + ": " + t.validadeDias + " dias (preenchida ao informar a emissão; confira no documento). " : "") +
    (v.validade ? "Avisos em: " + R.lerAvisos(v.avisos, t.avisos).map(d => d ? fData(R.somaDias(v.validade, -d)) : "no dia").join(", ") + "." : "");
}
function abrirDocumento(d, renovar) {
  const valores = d ? { ...d } : { tipo: "cnd_federal", nome: R.tipoDocumento("cnd_federal").nome, situacao: "valido" };
  if (renovar) { valores.emissao = hoje(); const t = R.tipoDocumento(d.tipo); valores.validade = t.validadeDias ? R.somaDias(hoje(), t.validadeDias) : ""; valores.numero = ""; }
  formulario({
    titulo: renovar ? "Renovar: " + d.nome : d ? d.nome : "Novo documento", campos: CAMPOS_DOCUMENTO, valores, previa: previaDocumento,
    nota: renovar ? "Informe os dados da nova certidão. A validade foi sugerida pelo prazo típico; confira a data impressa." : "",
    salvar: v => salvar("documentos", { ...d, ...v }, renovar ? "Documento renovado." : "Documento salvo."),
    excluir: d && !renovar && (() => remover("documentos", d.id))
  });
}

function abrirPrazo(l, p) {
  const campos = [
    { k: "tipo", r: "Tipo de prazo", t: "select", ops: () => R.TIPOS_PRAZO.map(t => [t.id, t.nome]) },
    { k: "descricao", r: "Descrição", ph: "Opcional" },
    { k: "base", r: "Data do ato / intimação", t: "date", dica: "Para recurso e contrarrazões: dia da intimação ou da ata. O prazo é calculado em dias úteis." },
    { k: "limite", r: "Prazo final", t: "datetime-local", req: true },
    { k: "feito", r: "Já cumprido", t: "check" }
  ];
  const calc = (v, ultimo, form) => {
    const t = R.tipoPrazo(v.tipo);
    if (form && ["tipo", "base"].includes(ultimo) && !form.elements.limite.dataset.mexido) {
      let lim = "";
      if (t.diasUteis && v.base) lim = R.somaDiasUteis(v.base, t.diasUteis) + "T23:59";
      if (t.diasUteisAntes && l.sessao) lim = R.somaDiasUteis(l.sessao.slice(0, 10), -t.diasUteisAntes) + "T23:59";
      if (lim) form.elements.limite.value = lim;
    }
    return t.regra + (t.diasUteis || t.diasUteisAntes ? " Cálculo: só feriados nacionais são descontados, então o prazo calculado nunca fica depois do real. Confira o horário limite no portal e no edital." : "");

let tRelogio, bipou = false;
function relogio(reg) {
  clearInterval(tRelogio);
  const el = $("#lRelogio"); if (!el) return;
  const tick = () => {
    if (!document.body.contains(el)) return clearInterval(tRelogio);
    if (!reg.inicio) { el.textContent = "--:--"; return; }
    const fim = R.fimEtapaAberta(reg.inicio, reg.log.map(x => x.t)) + (reg.extra || 0);
    const resta = fim - Date.now();
    el.classList.toggle("fim", resta < 120000);
    if (resta <= 0) { el.textContent = "00:00"; $("#lRelogioTxt").textContent = "Tempo previsto encerrado. Confira no portal se a etapa terminou ou se houve prorrogação."; return; }
    const m = Math.floor(resta / 60000), s = Math.floor((resta % 60000) / 1000);
    el.textContent = R.pad(m) + ":" + R.pad(s);
    $("#lRelogioTxt").textContent = "Fim previsto às " + new Date(fim).toLocaleTimeString("pt-BR") + (resta < 120000 ? ". Últimos 2 minutos: cada lance prorroga a etapa." : ".");
    if (resta < 120000 && !bipou && $("#lSom") && $("#lSom").checked) { bipou = true; bip(); }
    if (resta >= 120000) bipou = false;
  };
  tick(); tRelogio = setInterval(tick, 500);
}
function bip() {
  try { const c = new AudioContext(), o = c.createOscillator(), g = c.createGain(); o.frequency.value = 880; o.connect(g); g.connect(c.destination); g.gain.value = .15; o.start(); o.stop(c.currentTime + .35); } catch {}
}

  const l = S.dados.licitacoes.find(x => x.id === S.lance.lic), chave = "lance-" + S.lance.lic + "-" + S.lance.item;

function formulario({ titulo, campos, valores, salvar: aoSalvar, excluir, previa, nota }) {
  const dlg = $("#dlg"), f = $("#dlgForm");
  const val = k => valores[k] ?? "";
  const ops = c => (typeof c.ops === "function" ? c.ops() : c.ops);
  const dica = c => (typeof c.dica === "function" ? c.dica(valores) : c.dica || "");
  f.innerHTML = `<div class="dlg-h"><h2>${esc(titulo)}</h2><button type="button" class="x" data-fechar aria-label="Fechar">×</button></div>
    <div class="dlg-b">
      ${nota ? `<p class="nota">${esc(nota)}</p>` : ""}
      ${campos.map(c => {
        if (c.secao) return `<h3>${esc(c.secao)}</h3>`;
        if (c.t === "hidden") return "";
        if (c.t === "check") return `<label class="check ${c.wide ? "wide" : ""}"><input type="checkbox" name="${c.k}" ${val(c.k) ? "checked" : ""}> ${esc(c.r)}</label>`;
        let inp;
        if (c.t === "select") inp = `<select name="${c.k}">${ops(c).map(([v, n]) => `<option value="${esc(v)}" ${String(val(c.k)) === String(v) ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>`;
        else if (c.t === "textarea") inp = `<textarea name="${c.k}" placeholder="${esc(c.ph || "")}">${esc(val(c.k))}</textarea>`;
        else inp = `<input name="${c.k}" type="${c.t === "number" ? "text" : c.t || "text"}" ${c.t === "number" ? 'inputmode="decimal"' : ""} value="${esc(c.t === "datetime-local" ? String(val(c.k)).slice(0, 16) : val(c.k))}" placeholder="${esc(c.ph || "")}" ${c.req ? "required" : ""}>`;
        return `<label class="field ${c.wide ? "wide" : ""}"><span>${esc(c.r)}${c.req ? " *" : ""}</span>${inp}${dica(c) ? `<small data-dica="${c.k}">${esc(dica(c))}</small>` : ""}</label>`;
      }).join("")}
      ${previa ? '<p class="nota" id="previa"></p>' : ""}
      <p class="err wide" id="dlgErro" hidden></p>
    </div>
    <div class="dlg-f">${excluir ? '<button type="button" class="btn btn-danger esq" data-excluir>Excluir</button>' : ""}<button type="button" class="btn" data-fechar>Cancelar</button><button type="submit" class="btn btn-primary">Salvar</button></div>`;
  const ler = () => {
    const v = {};
    for (const c of campos) {
      if (!c.k) continue;
      if (c.t === "hidden") { v[c.k] = valores[c.k] ?? ""; continue; }
      const el = f.elements[c.k];
      if (c.t === "check") v[c.k] = el.checked;
      else if (c.t === "number") { const t = el.value.trim(); v[c.k] = t === "" ? "" : R.lerNumero(t); }
      else v[c.k] = el.value.trim();
    }
    return v;
  };
  const atualizar = ultimo => {
    const v = ler();
    if (previa) $("#previa", f).textContent = previa(v, ultimo, f) || "";
    for (const c of campos) if (typeof c.dica === "function" && c.k) { const d = $(`[data-dica="${c.k}"]`, f); if (d) d.textContent = c.dica(v); }
  };
  f.oninput = e => { if (e.target.name) { if (e.isTrusted && ["validade", "limite"].includes(e.target.name)) e.target.dataset.mexido = "1"; atualizar(e.target.name); } };
  f.onchange = f.oninput;
  atualizar();
  f.onclick = async e => {
    if (e.target.closest("[data-fechar]")) dlg.close();
    if (e.target.closest("[data-excluir]") && confirm("Excluir definitivamente?")) { try { await excluir(); dlg.close(); } catch (err) { aviso(err.message, true); } }
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const v = ler(), falta = campos.filter(c => c.req && (v[c.k] === "" || v[c.k] === null)).map(c => c.r);
    const erro = $("#dlgErro", f);
    if (falta.length) { erro.hidden = false; erro.textContent = "Preencha: " + falta.join(", ") + "."; return; }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true;
    try { await aoSalvar(v); dlg.close(); }
    catch (err) { erro.hidden = false; erro.textContent = err.message; }
    finally { btn.disabled = false; }
  };
  dlg.showModal();
  const primeiro = f.querySelector(".dlg-b input, .dlg-b select, .dlg-b textarea"); if (primeiro) primeiro.focus();
}

function escolherArquivo(col) { colecaoImportar = col; const a = $("#arquivo"); a.value = ""; a.click(); }
let carregandoXLSX;
function xlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return (carregandoXLSX = carregandoXLSX || new Promise((ok, falha) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => ok(window.XLSX); s.onerror = () => falha(new Error("Não consegui carregar o leitor de Excel. Salve a planilha como CSV e tente de novo."));
    document.head.appendChild(s);
  }));
}
// Lê a planilha e acha a linha de cabeçalho (às vezes há título acima dela) e a aba com mais colunas reconhecidas.
async function lerPlanilha(arquivo, col) {
  const tabelas = [];
  if (/\.csv$/i.test(arquivo.name) || arquivo.type === "text/csv") {
    const linhas = R.lerCSV(await arquivo.text());
    tabelas.push({ aba: "", cab: Object.keys(linhas[0] || {}), linhas });
  } else {
    const X = await xlsx(), wb = X.read(await arquivo.arrayBuffer(), { cellDates: true });
    for (const aba of wb.SheetNames) {
      const m = X.utils.sheet_to_json(wb.Sheets[aba], { header: 1, defval: "", raw: true, blankrows: false });
      let melhor = -1, nota = 0;
      for (let i = 0; i < Math.min(m.length, 15); i++) { const n = Object.keys(R.mapearColunas(m[i].map(String), col)).length; if (n > nota) { nota = n; melhor = i; } }
      if (melhor < 0) continue;
      const cab = m[melhor].map((h, i) => String(h).trim() || "Coluna " + (i + 1));
      tabelas.push({ aba, cab, linhas: m.slice(melhor + 1).filter(l => l.some(c => String(c).trim())).map(l => Object.fromEntries(cab.map((h, i) => [h, l[i] ?? ""]))) });
    }
  }
  tabelas.forEach(t => (t.mapa = R.mapearColunas(t.cab, col)));
  tabelas.sort((a, b) => Object.keys(b.mapa).length - Object.keys(a.mapa).length);
  return tabelas[0] || null;
}
$("#arquivo").addEventListener("change", tentar(async e => {

      <p class="small muted" style="margin-top:10px">${atualizados ? atualizados + " já estão cadastrados e serão atualizados com os dados da planilha; os demais entram como novos." : "Todos entram como novos."} A comparação usa ${{ contratos: "número e cliente", documentos: "nome e emissor", licitacoes: "número e órgão" }[col]}.</p>
    </div>
    <div class="dlg-f"><button type="button" class="btn" data-fechar>Cancelar</button><button type="submit" class="btn btn-primary" ${ok.length ? "" : "disabled"}>Importar ${ok.length}</button></div>`;
  f.onclick = ev => { if (ev.target.closest("[data-fechar]")) dlg.close(); };
  f.oninput = f.onchange = null;
  f.onsubmit = tentar(async ev => {
    ev.preventDefault();
    const extras = col === "licitacoes" ? { prazos: [], itens: [], mensagens: [] } : col === "contratos" ? { situacao: "vigente" } : { situacao: "valido" };
    const itens = ok.map(r => { const e = existentes.get(chaveImport(col, r)); return e ? { ...e, ...r } : { ...extras, ...r }; });
    for (let i = 0; i < itens.length; i += 500) await api("api/dados", { acao: "importar", colecao: col, itens: itens.slice(i, i + 500) });
    dlg.close(); aviso(ok.length + " registros importados" + (atualizados ? " (" + atualizados + " já existiam e foram atualizados)" : "") + "."); await carregar();

function baixar(nome, conteudo, tipo) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
