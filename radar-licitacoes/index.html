<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar de Licitações</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app interno com menu lateral (Buscar, Salvos, Portais), busca no topo da área principal,
   lista de editais em linhas com o prazo à esquerda e um painel lateral com o resumo do edital. */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EDF1F6; --line:#DDE3EB; --line-2:#C9D2DE;
  --ink:#101A2B; --ink-2:#4A586C; --ink-3:#738197;
  --accent:#1C5FD4; --accent-hover:#174FB3; --accent-ink:#FFFFFF; --accent-soft:#E7EEFC;
  --ok:#17804F; --ok-soft:#E2F4EA; --crit:#C0362C; --crit-soft:#FCE8E6; --warn:#9A5B00; --warn-soft:#FDF0D9;
  --shade:rgb(16 26 43 / .42);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --line:#273347; --line-2:#34435B;
    --ink:#E8EDF4; --ink-2:#AEB9C9; --ink-3:#8593A8;
    --accent:#6E9CF5; --accent-hover:#8BB0F8; --accent-ink:#0A1630; --accent-soft:#1B2B4A;
    --ok:#62CE96; --ok-soft:#133224; --crit:#FF8C82; --crit-soft:#46201D; --warn:#F1B65C; --warn-soft:#3F2E12;
    --shade:rgb(0 0 0 / .55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131D; --surface:#151D2A; --surface-2:#1C2636; --line:#273347; --line-2:#34435B;
  --ink:#E8EDF4; --ink-2:#AEB9C9; --ink-3:#8593A8;
  --accent:#6E9CF5; --accent-hover:#8BB0F8; --accent-ink:#0A1630; --accent-soft:#1B2B4A;
  --ok:#62CE96; --ok-soft:#133224; --crit:#FF8C82; --crit-soft:#46201D; --warn:#F1B65C; --warn-soft:#3F2E12;
  --shade:rgb(0 0 0 / .55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.5}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Estrutura */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;background:var(--surface);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;font-family:var(--f-display);font-weight:800;font-size:16.5px;letter-spacing:-.01em}
.logo small{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--ink-3);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{appearance:none;display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:8px;background:none;color:var(--ink-2);text-align:left;cursor:pointer;font-weight:500}
.nav button svg{flex:none;width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button .c{margin-left:auto;font-size:12.5px;padding:0 7px;border-radius:99px;background:var(--surface-2);color:var(--ink-2)}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-link{margin-top:auto;padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none}
.side-link:hover{background:var(--surface-2)}
.side-link + .side-foot{margin-top:0}
.side-foot{margin-top:auto;padding:12px;border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.side-foot b{color:var(--ink)}

.main{min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1400px;margin-inline:auto;padding:28px clamp(16px,3vw,36px) 64px;display:flex;flex-direction:column;gap:20px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.page-h h1{font-size:clamp(22px,2.6vw,28px)}
.page-h p{color:var(--ink-2);margin-top:4px}
.updated{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
body{margin:0}
.updated::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.updated.ok::before{background:var(--ok)}
.updated.run::before{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.refresh{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
.refresh-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:8px 12px}
.refresh .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.refresh .btn[aria-busy="true"] svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btn:disabled{opacity:.6;cursor:default}
.refresh-msg{font-size:13px;color:var(--ink-2);max-width:46ch;text-align:right}
.refresh-msg.err{color:var(--crit)}
@media (max-width:720px){.refresh{align-items:flex-start;width:100%}.refresh-row{justify-content:flex-start}.refresh-msg{text-align:left}}

/* Busca */
.searchbox{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sb-row{display:flex;gap:10px;flex-wrap:wrap}
.sb-in{position:relative;flex:1 1 280px;min-width:0}
.sb-in svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);stroke:var(--ink-3);fill:none;stroke-width:2}
.sb-in input{width:100%;height:50px;padding:0 14px 0 44px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:16.5px}
.sb-in input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--accent-ink)}
.sb-row .btn{height:50px;padding:0 22px}
.sugest{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-3)}
.sugest button{appearance:none;border:1px dashed var(--line-2);background:none;border-radius:99px;padding:2px 10px;cursor:pointer;color:var(--ink-2)}
.sugest button:hover{border-color:var(--accent);color:var(--accent)}

/* Filtros por portal */
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px 12px;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.field select{width:100%;min-width:0;height:40px;padding:0 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);font-size:14.5px}
.field select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.field select.on{border-color:var(--accent);background:var(--accent-soft)}
.field select:disabled{opacity:.55}
.chips-ativos{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--ink-3)}
.chip-x{appearance:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--accent);border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.chip-x span{font-size:15px;line-height:1}
@media (max-width:860px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}.filters .btn{grid-column:1/-1}}
.portal-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.pf{appearance:none;flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink-2);white-space:nowrap}
.pf .n{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pf:hover{border-color:var(--line-2);color:var(--ink)}
.pf[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.pf[aria-pressed="true"] .n{color:var(--surface);opacity:.75}

/* Resumo e ordenação */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.summary{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14.5px;color:var(--ink-2)}
.summary b{color:var(--ink);font-weight:600}
.summary .alert b{color:var(--crit)}
.sort{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-3)}
.sort select{height:36px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

/* Lista de editais */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) 150px auto;gap:6px 20px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.due{display:flex;flex-direction:column;align-items:center;justify-content:center;height:68px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.due b{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.due span{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.due.crit{background:var(--crit-soft);color:var(--crit)}
.due.warn{background:var(--warn-soft);color:var(--warn)}
.r-main{min-width:0}
.r-top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.portal-tag{font-weight:600;color:var(--ink-2)}
.new{padding:0 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.r-obj{font-weight:600;margin-top:3px;color:var(--ink);overflow-wrap:anywhere}
.r-org{color:var(--ink-2);font-size:14.5px;overflow-wrap:anywhere}
.r-val{text-align:right}
.r-val b{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.r-val small{font-size:12.5px;color:var(--ink-3)}
.r-act{display:flex;gap:6px;align-items:center}
/* Tabela de editais: texto pequeno, uma linha por edital */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;min-width:980px;border-collapse:collapse;font-size:13px;line-height:1.4}
.tbl th{position:sticky;top:0;background:var(--surface);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tbody tr.sel td{background:var(--accent-soft)}
.tbl tbody tr.prio td:first-child{box-shadow:inset 3px 0 0 var(--crit)}
.c-org{width:31%;min-width:0}
.c-org .wrap2{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start}
.mais{appearance:none;display:grid;place-items:center;width:28px;height:28px;border:1px solid var(--line);border-radius:7px;background:var(--surface-2);color:var(--ink-2);font-size:16px;line-height:1;cursor:pointer}
.mais:hover{border-color:var(--accent);color:var(--accent)}
.t-org{font-weight:700;font-size:12.5px;color:var(--ink);text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.t-tags{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 2px}
.t-tag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--ok-soft);color:var(--ok);text-transform:uppercase}
.t-tag.novo{background:var(--accent-soft);color:var(--accent)}
.t-num{font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.t-obj{font-size:12px;color:var(--ink-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.t-mun{font-size:11.5px;color:var(--ink-3);margin-top:3px;min-width:84px;overflow-wrap:normal;word-break:normal;hyphens:auto}
.uf{display:inline-grid;place-items:center;min-width:32px;height:26px;padding:0 6px;border-radius:6px;background:var(--surface-2);font-weight:700;font-size:12px;color:var(--ink)}
.t-prazo b{display:block;color:var(--ink);font-weight:600;white-space:nowrap}
.t-prazo small{font-size:11.5px;color:var(--ink-3)}
.t-prazo.crit small{color:var(--crit);font-weight:600}
.t-prazo.warn small{color:var(--warn);font-weight:600}
.t-val{font-weight:700;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.t-val.nd{font-weight:600;color:var(--ink-3)}
.prio-pill{display:inline-block;white-space:nowrap;padding:3px 9px;border-radius:6px;font-size:11.5px;font-weight:700}
.prio-pill.alta{background:var(--crit-soft);color:var(--crit)}
.prio-pill.media{background:var(--warn-soft);color:var(--warn)}
.prio-pill.normal{background:var(--surface-2);color:var(--ink-2)}
.t-salvar{appearance:none;display:block;margin-top:6px;border:0;background:none;padding:0;font-size:11.5px;color:var(--ink-3);cursor:pointer}
.t-salvar[aria-pressed="true"]{color:var(--accent);font-weight:600}
.t-salvar:hover{color:var(--accent)}
.t-pub a{font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap}
.t-pub a:hover{text-decoration:underline}
.t-pub small{display:block;font-size:11px;color:var(--ink-3);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:860px){
  .tbl{min-width:0}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block}
  .tbl tbody tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;padding:14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{padding:0;border:0;min-width:0}
  .tbl tbody tr:hover td,.tbl tbody tr.sel td{background:none}
  .tbl tbody tr.sel{background:var(--accent-soft)}
  .tbl tbody tr.prio td:first-child{box-shadow:none}
  .tbl td.c-org{grid-column:1/-1;width:auto}
  .tbl td[data-l]::before{content:attr(data-l);display:block;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
}
.icon-btn{appearance:none;display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink-3)}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.icon-btn[aria-pressed="true"] svg{fill:currentColor}
.empty{padding:44px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);margin-bottom:4px}

/* Portais */
.portals{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.pcard h3{font-size:16px}
.pcard p{font-size:14px;color:var(--ink-2)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.pcard .foot span{font-size:13.5px;color:var(--ink-3)}
.pcard .term{font-size:12px;font-weight:600;color:var(--ok)}

/* Painel do edital */
.shade{position:fixed;inset:0;z-index:40;background:var(--shade)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(460px,100%);display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgb(0 0 0 / .14);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 22px 16px;border-bottom:1px solid var(--line)}
.d-head h2{font-size:19px;line-height:1.3}
.d-head .r-top{margin-bottom:6px}
.d-body{flex:1 1 auto;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:18px}
.d-due{display:flex;align-items:center;gap:14px;padding:14px;border-radius:8px;background:var(--surface-2)}
.d-due.crit{background:var(--crit-soft)} .d-due.warn{background:var(--warn-soft)}
.d-due .due{height:56px;width:62px;background:var(--surface)}
.d-due p{font-size:14px;color:var(--ink-2)}
.d-due p b{display:block;color:var(--ink);font-size:15px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0}
.dl div{min-width:0}
.dl dt{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.dl dd{margin:2px 0 0;overflow-wrap:anywhere}
.dl .wide{grid-column:1/-1}
.checks h3{font-size:14.5px;margin-bottom:8px}
.docs h3{font-size:14.5px;margin-bottom:8px}
.docs ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.docs li a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px}
.docs li:first-child a{border-top:0}
.docs li a:hover{background:var(--surface-2);color:var(--accent)}
.docs li small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.docs .info{font-size:13.5px;color:var(--ink-2)}
.docs .links-alt{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13.5px}
.t-pub .alt{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:600}
.checks label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px;cursor:pointer}
.checks input{width:17px;height:17px;margin-top:2px;accent-color:var(--accent)}
.d-foot{display:flex;gap:8px;padding:14px 22px;border-top:1px solid var(--line)}
.d-foot .btn{flex:1 1 auto;height:44px}

/* Celular e tablet */
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{min-width:0}
  .side{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}
  .logo small,.side-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;flex:1 1 auto;min-width:0}
  .nav button{width:auto;white-space:nowrap}
}
@media (max-width:720px){
  .row{grid-template-columns:64px minmax(0,1fr);align-items:start}
  .r-val{grid-column:2;text-align:left}
  .r-val b{display:inline;margin-right:6px}
  .r-act{grid-column:1/-1}
  .r-act .btn{flex:1 1 auto}
  .due{height:60px}
  .due b{font-size:21px}
  .sb-row .btn{flex:1 1 100%}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slide .2s ease-out}
  @keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
  .btn,.pf,.nav button,.icon-btn,.row{transition:background-color .15s,border-color .15s,color .15s}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="logo">
      <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="var(--accent)"/>
        <circle cx="16" cy="16" r="9" fill="none" stroke="var(--accent-ink)" stroke-opacity=".45" stroke-width="1.5"/>
        <circle cx="16" cy="16" r="4.5" fill="none" stroke="var(--accent-ink)" stroke-opacity=".45" stroke-width="1.5"/>
        <path d="M16 16 L23.5 9.5" stroke="var(--accent-ink)" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="21" cy="19.5" r="1.8" fill="var(--accent-ink)"/>
      </svg>
      <div>Radar de Licitações<small>Uso interno</small></div>
    </div>
    <nav class="nav" aria-label="Menu">
      <button type="button" data-view="buscar" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Buscar editais</button>
      <button type="button" data-view="salvos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Salvos<span class="c num" id="cSalvos">0</span></button>
      <button type="button" data-view="portais">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 20V9"/></svg>Portais<span class="c num" id="cPortais">0</span></button>
    </nav>
    <a class="side-link" href="gestao.html">Gestão de Prazos →</a>
    <p class="side-foot" id="sideFoot"><b>Fonte: PNCP.</b> Confira prazos e anexos no portal antes de participar.</p>
  </aside>

  <div class="main">
    <div class="content">
      <header class="page-h">
        <div><h1 id="pageTitle">Buscar editais</h1><p id="pageText">Editais com prazo aberto coletados do PNCP, com o portal onde a disputa acontece.</p></div>
        <div class="refresh">
          <div class="refresh-row">
            <span class="updated" id="updated">Carregando a coleta</span>
            <button type="button" class="btn" id="btnAtualizar" >
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>Atualizar agora</span></button>
          </div>
          <p class="refresh-msg" id="refreshMsg" role="status" hidden></p>
        </div>
      </header>

      <section id="vBuscar" class="content" style="padding:0;max-width:none;gap:16px">
        <form class="searchbox" id="form" role="search">
          <div class="sb-row">
            <label class="sb-in"><span class="sr">O que você procura</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="q" type="search" autocomplete="off" placeholder="Objeto, órgão, cidade ou número do edital">
            </label>
            <button class="btn btn-primary" type="submit">Buscar</button>
          </div>
          <div class="sugest" id="sugest">Sugestões:</div>
        </form>
        <div class="filters" role="group" aria-label="Filtros">
          <div class="field"><label for="fTema">Palavra-chave</label><select id="fTema"><option value="">Todas</option></select></div>
          <div class="field"><label for="fUf">Estado</label><select id="fUf"><option value="">Todos</option></select></div>
          <div class="field"><label for="fMun">Município</label><select id="fMun"><option value="">Todos</option></select></div>
          <div class="field"><label for="fMod">Modalidade</label><select id="fMod"><option value="">Todas</option></select></div>
          <button type="button" class="btn" id="limpar">Limpar filtros</button>
        </div>
        <div class="chips-ativos" id="ativos" hidden></div>
        <div class="portal-filter" id="pfilter" role="group" aria-label="Filtrar por portal"></div>
        <div class="toolbar">
          <div class="summary" id="summary"></div>
          <label class="sort">Ordenar por
            <select id="ord"><option value="prazo">Prazo mais próximo</option><option value="valor">Maior valor</option><option value="novo">Novos primeiro</option></select>
          </label>
        </div>
        <div class="list" id="list"></div>
      </section>

      <section id="vSalvos" hidden>
        <div class="list" id="listSalvos"></div>
      </section>

      <section id="vPortais" hidden>
        <div class="portals" id="portals"></div>
      </section>
    </div>
  </div>
</div>

<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" hidden></aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const brl = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
  const brlC = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL",notation:"compact",maximumFractionDigits:1});
  const fData = new Intl.DateTimeFormat("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
  const fDia = new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",timeZone:"America/Sao_Paulo"});
  const fCurta = new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"America/Sao_Paulo"});
  const fHora = new Intl.DateTimeFormat("pt-BR",{hour:"2-digit",minute:"2-digit",timeZone:"America/Sao_Paulo"});
  const DIA = 86400000;

  // Portais. Só o PNCP aceita o termo direto na URL; os demais abrem a página de busca pública.
  const PORTAIS = [
    {id:"PNCP", nome:"PNCP", url:q => "https://pncp.gov.br/app/editais?" + (q ? "q=" + encodeURIComponent(q) + "&" : "") + "status=recebendo_proposta&pagina=1", desc:"Portal Nacional de Contratações Públicas. Reúne os editais da Lei 14.133.", termo:true},
    {id:"Compras.gov.br", nome:"Compras.gov.br", url:() => "https://www.gov.br/compras/pt-br", desc:"Compras do governo federal."},
    {id:"BLL", nome:"BLL Compras", url:() => "https://bllcompras.com/process/processsearchpublic?param1=0", desc:"Pregões de municípios e consórcios."},
    {id:"Licitações-e", nome:"Licitações-e (BB)", url:() => "https://licitacoes-e2.bb.com.br/aop-inter-estatico/pesquisar-processo-publico", desc:"Plataforma do Banco do Brasil."},
    {id:"Portal de Compras Públicas", nome:"Portal de Compras Públicas", url:() => "https://www.portaldecompraspublicas.com.br/processos", desc:"Processos de estados e municípios."},
    {id:"BNC", nome:"BNC Compras", url:() => "https://bnccompras.com/Process/ProcessSearchPublic?param1=0", desc:"Bolsa Nacional de Compras."},
    {id:"Licitanet", nome:"Licitanet", url:() => "https://licitanet.com.br/sessao-publica", desc:"Sessões públicas de pregões municipais."},
    {id:"Licitar Digital", nome:"Licitar Digital", url:() => "https://app2.licitardigital.com.br/pesquisa", desc:"Pesquisa de processos municipais."},
    {id:"Compras AM", nome:"Compras AM (e-Compras)", url:() => "https://www.e-compras.am.gov.br/publico/", desc:"Compras do Governo do Amazonas."}
  ];
  const portal = id => PORTAIS.find(p => p.id === id) || {id, nome:id || "Outro portal", url:() => "", desc:""};

  const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
  const S = {view:"buscar", fonte:"", star:new Set(store.get("rl_star_real") || []), sel:null, checks:store.get("rl_checks_real") || {}, lastFocus:null, items:[], coleta:null, phase:"loading", buscando:false, nota:"", notaErr:false, reserva:false};
  const h = (location.hash || "").slice(1); if (["buscar","salvos","portais"].includes(h)) S.view = h;

  // Datas do PNCP vêm no horário de Brasília, sem fuso
  const toDate = s => { if (!s) return null; const d = new Date(/[zZ]|[+-]\d\d:\d\d$/.test(s) ? s : s + "-03:00"); return isNaN(d) ? null : d; };
  const abertos = () => S.items.filter(it => it.prazo && it.prazo > Date.now());
  const dias = it => Math.max(0, Math.ceil((it.prazo - Date.now()) / DIA));
  const nivel = it => { const n = dias(it); return n <= 7 ? "crit" : n <= 15 ? "warn" : ""; };
  const casa = (it, q) => !q || norm(q).split(/\s+/).filter(Boolean).every(w => it.busca.includes(w.length > 4 ? w.replace(/(oes|aes|s)$/,"") : w));
  const urlEdital = it => it.url || portal(it.fonte).url(it.edital);
  const valorTxt = it => it.valor > 0 ? brl.format(it.valor) : (it.valorNota || "Não divulgado");
  const ICON_STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

  const ESPEC = {hemodialise:"Hemodiálise e TRS", plantoes:"Plantões médicos", urgencia:"Urgência e emergência"};
  const fPrazo = new Intl.DateTimeFormat("pt-BR",{day:"2-digit",month:"short",year:"numeric",timeZone:"America/Sao_Paulo"});
  const brl2 = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
  function especTxt(it){
    if (ESPEC[it.especialidade]) return ESPEC[it.especialidade];
    const t = TEMAS.find(x => temasDe(it).includes(x[0]));
    return t ? t[1] : "Outros serviços médicos";
  }
  function prioridade(it){
    const n = dias(it);
    return n <= 7 || it.especialidade === "hemodialise" ? ["alta","Alta prioridade"] : n <= 15 ? ["media","Média prioridade"] : ["normal","Acompanhar"];
  }
  function row(it){
    const n = dias(it), salvo = S.star.has(it.id), pr = prioridade(it);
    const num = [it.edital, it.processo ? "Processo " + it.processo : ""].filter(Boolean).join(" • ");
    return '<tr class="' + (S.sel === it.id ? "sel " : "") + (pr[0] === "alta" ? "prio" : "") + '" data-row="' + esc(it.id) + '" tabindex="0" aria-label="Abrir resumo: ' + esc(it.objeto) + '">' +
      '<td class="c-org"><div class="wrap2"><button type="button" class="mais" data-open="' + esc(it.id) + '" aria-label="Abrir resumo do edital" title="Resumo do edital">+</button><div style="min-width:0">' +
        '<div class="t-org">' + esc(it.orgao) + "</div>" +
        ((it.ebserh || it.novo) ? '<div class="t-tags">' + (it.ebserh ? '<span class="t-tag">EBSERH</span>' : "") + (it.novo ? '<span class="t-tag novo">Novo</span>' : "") + "</div>" : "") +
        (num ? '<div class="t-num">' + esc(num) + "</div>" : "") +
        '<div class="t-obj" title="' + esc(it.objeto) + '">' + esc(it.objeto) + "</div></div></div></td>" +
      '<td data-l="Modalidade">' + esc(it.modalidade || "—") + "</td>" +
      '<td data-l="Especialidade">' + esc(especTxt(it)) + "</td>" +
      '<td data-l="UF"><span class="uf">' + esc(it.uf || "—") + "</span>" + (it.municipio ? '<div class="t-mun">' + esc(it.municipio) + "</div>" : "") + "</td>" +
      '<td data-l="Prazo informado" class="t-prazo ' + nivel(it) + '"><b>' + fPrazo.format(it.prazo).replace(/\./g, "").replace(/ de /g, " ") + " • " + fHora.format(it.prazo) + "</b><small>" + (n === 0 ? "vence hoje" : n === 1 ? "1 dia" : n + " dias") + "</small></td>" +
      '<td data-l="Valor estimado">' + (it.valor > 0 ? '<span class="t-val">' + brl2.format(it.valor) + "</span>" : '<span class="t-val nd">Não informado</span>') + "</td>" +
      '<td data-l="Acompanhamento"><span class="prio-pill ' + pr[0] + '">' + pr[1] + '</span><button type="button" class="t-salvar" data-star="' + esc(it.id) + '" aria-pressed="' + salvo + '">' + (salvo ? "★ Salvo" : "☆ Salvar") + "</button></td>" +
      '<td data-l="Publicação" class="t-pub"><a href="' + esc(urlEdital(it)) + '" target="_blank" rel="noopener" data-stop>Ver publicação ↗</a><small>' + esc(portal(it.fonte).nome) + (it.pub ? " • publicada " + fCurta.format(it.pub) : "") + "</small>" +
        (it.linkOrigem ? '<a class="alt" href="' + esc(it.linkOrigem) + '" target="_blank" rel="noopener" data-stop>Portal de origem ↗</a>' : "") + "</td>" +
    "</tr>";
  }
  const tabela = lista => '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Órgão / Objeto</th><th>Modalidade</th><th>Especialidade</th><th>UF</th><th>Prazo informado</th><th>Valor estimado</th><th>Acompanhamento</th><th>Publicação</th></tr></thead><tbody>' + lista.map(row).join("") + "</tbody></table></div>";
  const vazio = (t, s) => '<div class="empty"><b>' + t + "</b>" + s + "</div>";
  function vazioBase(){
    return S.phase === "loading" ? vazio("Buscando editais no PNCP", "A lista mostra órgão, objeto, prazo e valor de cada edital com prazo aberto.")
      : S.phase === "offline" ? vazio("Sem conexão com o PNCP", "Verifique sua internet e toque em Atualizar agora.")
      : vazio("Nenhum edital com prazo aberto", "A busca não trouxe editais com prazo futuro. Toque em Atualizar agora para buscar de novo.");
  }

  // Filtros: palavra-chave (temas do objeto), estado, município e modalidade
  const TEMAS = [
    ["hemodialise","Hemodiálise e nefrologia",/hemodial|dialise|nefrolog|renal/],
    ["plantao","Plantões médicos",/plantao|plantoes|plantonista/],
    ["urgencia","Urgência e emergência",/urgencia|emergencia|pronto.?socorro|pronto atendimento|\bupa|samu/],
    ["uti","UTI e terapia intensiva",/\buti\b|utis\b|terapia intensiva/],
    ["clinica","Clínica geral e atenção básica",/clinica geral|clinica medica|atencao (basica|primaria)|\bubs\b|\besf\b/],
    ["especialidades","Especialidades médicas",/especializad|especialidade|oftalmo|ortoped|cardiolog|pediatr|obstetr|ginecolog|psiqui|anestes|neurolog/],
    ["exames","Exames e imagem",/exame|imagem|ressonancia|tomografia|ultrassom|ultrassonografia|raio.?x|laborator/],
    ["cirurgia","Cirurgias",/cirurg/],
    ["ambulancia","Ambulância e remoção",/ambulanc|remocao|samu/]
  ];
  const temasDe = it => it.temas || (it.temas = TEMAS.filter(t => t[2].test(norm(it.objeto + " " + (it.edital || "")))).map(t => t[0]));
  function modGrupo(m){
    const n = norm(m);
    return /preg/.test(n) ? "Pregão" : /dispensa/.test(n) ? "Dispensa" : /credenc|chamamento/.test(n) ? "Credenciamento" : /concorr/.test(n) ? "Concorrência" : /inexig/.test(n) ? "Inexigibilidade" : /leil/.test(n) ? "Leilão" : /dialogo/.test(n) ? "Diálogo competitivo" : m || "Outra";
  }
  const F = {tema:"", uf:"", mun:"", mod:""};
  function passa(it, sem){
    return (sem === "tema" || !F.tema || temasDe(it).includes(F.tema))
      && (sem === "uf" || !F.uf || it.uf === F.uf)
      && (sem === "mun" || !F.mun || it.uf + "|" + it.municipio === F.mun)
      && (sem === "mod" || !F.mod || modGrupo(it.modalidade) === F.mod)
      && (sem === "fonte" || !S.fonte || it.fonte === S.fonte);
  }
  function opcoes(id, todos, itens, atual){
    const sel = $(id);
    sel.innerHTML = '<option value="">' + todos + "</option>" + itens.map(([v,t,n]) => '<option value="' + esc(v) + '"' + (v === atual ? " selected" : "") + ">" + esc(t) + " (" + n + ")</option>").join("");
    if (atual && !itens.some(i => i[0] === atual)) { sel.insertAdjacentHTML("beforeend", '<option value="' + esc(atual) + '" selected>' + esc(atual.split("|").pop()) + " (0)</option>"); }
    sel.classList.toggle("on", !!atual);
  }
  const contar = (lista, chave) => { const m = new Map(); lista.forEach(it => [].concat(chave(it)).forEach(k => { if (k) m.set(k, (m.get(k) || 0) + 1); })); return m; };
  function renderFiltros(porTermo){
    const cT = contar(porTermo.filter(it => passa(it, "tema")), temasDe);
    opcoes("fTema", "Todas", TEMAS.filter(t => cT.get(t[0])).map(t => [t[0], t[1], cT.get(t[0])]), F.tema);
    const cU = contar(porTermo.filter(it => passa(it, "uf")), it => it.uf);
    opcoes("fUf", "Todos", [...cU].sort((a,b) => a[0].localeCompare(b[0])).map(([u,n]) => [u, u + " · " + (UFS[u] || u), n]), F.uf);
    const cM = contar(porTermo.filter(it => passa(it, "mun")), it => it.municipio ? it.uf + "|" + it.municipio : "");
    opcoes("fMun", F.uf ? "Todos de " + F.uf : "Todos", [...cM].sort((a,b) => a[0].split("|")[1].localeCompare(b[0].split("|")[1], "pt-BR")).map(([k,n]) => [k, k.split("|")[1] + (F.uf ? "" : "/" + k.split("|")[0]), n]), F.mun);
    const cMo = contar(porTermo.filter(it => passa(it, "mod")), it => modGrupo(it.modalidade));
    opcoes("fMod", "Todas", [...cMo].sort((a,b) => b[1] - a[1]).map(([m,n]) => [m, m, n]), F.mod);
    const ativos = [];
    if (F.tema) ativos.push(["tema", (TEMAS.find(t => t[0] === F.tema) || [,F.tema])[1]]);
    if (F.uf) ativos.push(["uf", UFS[F.uf] || F.uf]);
    if (F.mun) ativos.push(["mun", F.mun.split("|")[1] + "/" + F.mun.split("|")[0]]);
    if (F.mod) ativos.push(["mod", F.mod]);
    if (S.fonte) ativos.push(["fonte", portal(S.fonte).nome]);
    $("ativos").hidden = !ativos.length;
    $("ativos").innerHTML = "Filtrando por:" + ativos.map(([k,t]) => '<button type="button" class="chip-x" data-tira="' + k + '" aria-label="Remover filtro ' + esc(t) + '">' + esc(t) + ' <span aria-hidden="true">×</span></button>').join("");
    $("limpar").disabled = !ativos.length && !$("q").value.trim();
  }
  const UFS = {AC:"Acre",AL:"Alagoas",AP:"Amapá",AM:"Amazonas",BA:"Bahia",CE:"Ceará",DF:"Distrito Federal",ES:"Espírito Santo",GO:"Goiás",MA:"Maranhão",MT:"Mato Grosso",MS:"Mato Grosso do Sul",MG:"Minas Gerais",PA:"Pará",PB:"Paraíba",PR:"Paraná",PE:"Pernambuco",PI:"Piauí",RJ:"Rio de Janeiro",RN:"Rio Grande do Norte",RS:"Rio Grande do Sul",RO:"Rondônia",RR:"Roraima",SC:"Santa Catarina",SP:"São Paulo",SE:"Sergipe",TO:"Tocantins"};

  function renderBuscar(){
    const q = $("q").value.trim(), base = abertos();
    const porTermo = base.filter(it => casa(it, q));
    renderFiltros(porTermo);
    const pBase = porTermo.filter(it => passa(it, "fonte"));
    $("pfilter").innerHTML = '<button type="button" class="pf" data-fonte="" aria-pressed="' + !S.fonte + '">Todos os portais <span class="n">' + pBase.length + "</span></button>" +
      PORTAIS.map(p => '<button type="button" class="pf" data-fonte="' + esc(p.id) + '" aria-pressed="' + (S.fonte === p.id) + '">' + esc(p.nome) + ' <span class="n">' + pBase.filter(it => it.fonte === p.id).length + "</span></button>").join("");
    const o = $("ord").value;
    const lista = porTermo.filter(it => passa(it))
      .sort((a,b) => o === "valor" ? (b.valor || 0) - (a.valor || 0) : o === "novo" ? (b.pub || 0) - (a.pub || 0) || (a.prazo - b.prazo) : a.prazo - b.prazo);
    const sete = lista.filter(it => dias(it) <= 7).length, comValor = lista.filter(it => it.valor > 0), total = comValor.reduce((s,it) => s + it.valor, 0);
    $("summary").innerHTML = S.phase !== "ready" ? "" : "<span><b class=\"num\">" + lista.length + "</b> " + (lista.length === 1 ? "edital com prazo aberto" : "editais com prazo aberto") + (q ? " para “" + esc(q) + "”" : "") + "</span>" +
      (sete ? '<span class="alert"><b class="num">' + sete + "</b> " + (sete === 1 ? "vence" : "vencem") + " em até 7 dias</span>" : "") +
      (comValor.length ? '<span><b class="num">' + brlC.format(total) + "</b> estimados em " + comValor.length + " com valor divulgado</span>" : "");
    $("list").innerHTML = !base.length ? vazioBase() : lista.length ? tabela(lista)
      : vazio("Nenhum edital com esses filtros", "Remova algum filtro acima ou busque direto em " + (S.fonte ? '<a href="' + esc(portal(S.fonte).url(q)) + '" target="_blank" rel="noopener">' + esc(portal(S.fonte).nome) + " ↗</a>" : '<a href="' + esc(PORTAIS[0].url(q)) + '" target="_blank" rel="noopener">PNCP ↗</a>') + ".");
  }
  function renderSalvos(){
    const lista = abertos().filter(it => S.star.has(it.id)).sort((a,b) => a.prazo - b.prazo);
    $("listSalvos").innerHTML = lista.length ? tabela(lista) : S.phase !== "ready" ? vazioBase() : vazio("Nenhum edital salvo", "Na busca, toque em Salvar na coluna Acompanhamento para guardar o edital aqui.");
  }
  function renderPortais(){
    const q = $("q").value.trim(), base = abertos();
    $("portals").innerHTML = PORTAIS.map(p => {
      const n = base.filter(it => it.fonte === p.id).length;
      return '<div class="pcard"><h3>' + esc(p.nome) + "</h3><p>" + esc(p.desc) + "</p>" + (p.termo ? '<span class="term">Abre já com o termo buscado</span>' : "") +
        '<div class="foot"><span class="num">' + n + (n === 1 ? " edital" : " editais") + ' no radar</span><a class="btn" href="' + esc(p.url(q)) + '" target="_blank" rel="noopener">Abrir portal ↗</a></div></div>';
    }).join("");
  }

  // Documentos do edital (PDFs publicados no PNCP), carregados quando o resumo abre
  const DOCS = {};
  async function carregarDocs(id){
    DOCS[id] = {estado:"carregando"};
    try {
      const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), 30000);
      const r = await fetch("/api/arquivos?id=" + encodeURIComponent(id), {signal: ctrl.signal});
      clearTimeout(t);
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !Array.isArray(j.arquivos)) throw new Error();
      DOCS[id] = {estado:"ok", arquivos:j.arquivos};
    } catch { DOCS[id] = {estado:"erro"}; }
    if (S.sel === id) renderDrawer();
  }
  function docsHtml(it){
    if (!/^\d{14}-\d{4}-\d+$/.test(it.id)) return "";
    const d = DOCS[it.id];
    if (!d) { carregarDocs(it.id); }
    const alt = '<div class="links-alt"><a href="' + esc(urlEdital(it)) + '" target="_blank" rel="noopener">Página do edital no PNCP ↗</a>' +
      (it.linkOrigem ? '<a href="' + esc(it.linkOrigem) + '" target="_blank" rel="noopener">Portal de origem ↗</a>' : "") + "</div>";
    const corpo = !d || d.estado === "carregando" ? '<p class="info">Buscando os documentos no PNCP…</p>'
      : d.estado === "erro" ? '<p class="info">O PNCP não respondeu agora. <button type="button" class="t-salvar" style="display:inline;margin:0;color:var(--accent);font-weight:600" data-docs="' + esc(it.id) + '">Tentar de novo</button></p>'
      : !d.arquivos.length ? '<p class="info">Nenhum documento publicado no PNCP para este edital.</p>'
      : "<ul>" + d.arquivos.map(a => '<li><a href="' + esc(a.url) + '" target="_blank" rel="noopener"><span>' + esc(a.titulo) + "</span><small>" + esc(a.tipo && a.tipo !== a.titulo ? a.tipo + " · " : "") + "abrir ↗</small></a></li>").join("") + "</ul>";
    return '<div class="docs"><h3>Documentos do edital</h3>' + corpo + alt + "</div>";
  }
  function renderDrawer(){
    const it = S.items.find(x => x.id === S.sel), d = $("drawer");
    $("shade").hidden = d.hidden = !it;
    if (!it) return;
    const n = dias(it), salvo = S.star.has(it.id), ck = S.checks[it.id] || [];
    const itens = ["Li o termo de referência e o objeto","Confirmei os documentos de habilitação","Verifiquei retificações e esclarecimentos","Anotei a data da sessão e o prazo de impugnação"];
    const campos = [["Órgão", esc(it.orgao) + (it.unidade ? '<br><span class="muted">' + esc(it.unidade) + "</span>" : ""), "wide"],["Local", esc(it.municipio) + "/" + esc(it.uf)],
      ["Valor estimado", it.valor > 0 ? '<b class="num">' + brl.format(it.valor) + "</b>" : '<span class="muted">' + esc(valorTxt(it)) + "</span>"],
      ["Modalidade", esc(it.modalidade) + (it.srp ? " · registro de preços" : "")],["Processo", it.processo ? '<span class="mono">' + esc(it.processo) + "</span>" : "—"],
      ["Publicado em", it.pub ? fCurta.format(it.pub) : "—"],["Portal de origem", esc(portal(it.fonte).nome)]];
    if (it.uasg) campos.push(["UASG", '<span class="mono">' + esc(it.uasg) + "</span>"]);
    d.innerHTML = '<div class="d-head"><div style="min-width:0"><div class="r-top"><span class="portal-tag">' + esc(portal(it.fonte).nome) + "</span>" + (it.edital ? '<span class="mono">' + esc(it.edital) + "</span>" : "") + "</div>" +
        '<h2 id="dTitle">' + esc(it.objeto) + "</h2></div>" +
        '<button type="button" class="icon-btn" data-close aria-label="Fechar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
      '<div class="d-body">' +
        '<div class="d-due ' + nivel(it) + '"><div class="due ' + nivel(it) + '"><b>' + n + "</b><span>" + (n === 1 ? "dia" : "dias") + "</span></div><p><b>Propostas até " + esc(fData.format(it.prazo)) + "</b>Horário de Brasília, como informado no PNCP. Confirme situação e retificações no edital.</p></div>" +
        '<dl class="dl">' + campos.map(([k,v,c]) => '<div class="' + (c || "") + '"><dt>' + k + "</dt><dd>" + v + "</dd></div>").join("") + "</dl>" +
        docsHtml(it) +
        '<div class="checks"><h3>Conferência do edital</h3>' + itens.map((t,i) => '<label><input type="checkbox" id="ck-' + esc(it.id) + "-" + i + '" data-ck="' + i + '"' + (ck.includes(i) ? " checked" : "") + "><span>" + t + "</span></label>").join("") + "</div>" +
      "</div>" +
      '<div class="d-foot"><a class="btn btn-primary" href="' + esc(urlEdital(it)) + '" target="_blank" rel="noopener">Ver edital no PNCP ↗</a><button type="button" class="btn" data-star="' + esc(it.id) + '" aria-pressed="' + salvo + '">' + (salvo ? "Salvo" : "Salvar") + "</button></div>";
  }

  function renderStatus(){
    const el = $("updated"), c = toDate(S.coleta && S.coleta.coletadaEm), foot = $("sideFoot");
    el.classList.toggle("ok", S.phase === "ready" && !S.reserva && !S.buscando);
    el.classList.toggle("run", S.buscando);
    if (S.buscando) el.textContent = "Buscando editais no PNCP";
    else if (S.phase === "loading") el.textContent = "Carregando editais";
    else if (S.phase === "offline") el.textContent = "Sem conexão com o PNCP";
    else el.textContent = (S.reserva ? "Cópia salva em " : "Atualizado ") + (c ? (S.reserva ? "" : ha(c) + " · ") + fCurta.format(c) + ", " + fHora.format(c) : "em data não informada");
    const btn = $("btnAtualizar"), msg = $("refreshMsg");
    btn.disabled = S.buscando;
    btn.setAttribute("aria-busy", String(S.buscando));
    btn.querySelector("span").textContent = S.buscando ? "Atualizando…" : "Atualizar agora";
    const texto = S.buscando ? "Consultando o PNCP. Pode levar até 1 minuto." : S.nota;
    msg.hidden = !texto; msg.textContent = texto || "";
    msg.classList.toggle("err", !S.buscando && S.notaErr);
    const vencidos = S.items.length - abertos().length;
    foot.innerHTML = "<b>Fonte: PNCP.</b> " + (S.phase === "ready" && S.items.length ? S.items.length + (S.items.length === 1 ? " edital na busca" : " editais na busca") + (vencidos > 0 ? ", " + vencidos + " com prazo encerrado ocultos" : "") + ". " : "") + "Confira prazos e anexos no portal antes de participar.";
  }

  function ha(d){
    const m = Math.round((Date.now() - d) / 60000);
    return m < 1 ? "agora" : m < 60 ? "há " + m + " min" : m < 1440 ? "há " + Math.floor(m / 60) + " h" : "há " + Math.floor(m / 1440) + (m < 2880 ? " dia" : " dias");
  }

  // Dados: o servidor do site (/api/editais) consulta o PNCP. A resposta fica em cache por 15 minutos;
  // o botão Atualizar pede uma busca nova (no máximo uma a cada 5 minutos, compartilhada por todos).
  async function buscar(nova){
    if (S.buscando) return;
    S.buscando = true; S.nota = ""; S.notaErr = false; render();
    try {
      const url = "/api/editais" + (nova ? "?t=" + Math.floor(Date.now() / 300000) : "");
      const ctrl = new AbortController(), limite = setTimeout(() => ctrl.abort(), 75000);
      const r = await fetch(url, {cache: nova ? "no-store" : "default", signal: ctrl.signal}).finally(() => clearTimeout(limite));
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !Array.isArray(j.editais)) throw new Error(j.erro || "O servidor não respondeu.");
      S.coleta = {base: j.base, coletadaEm: j.coletadaEm}; S.reserva = false;
      carregar(j.editais);
      if (nova) S.nota = j.editais.length + (j.editais.length === 1 ? " edital com prazo aberto." : " editais com prazo aberto.") + (j.avisos && j.avisos.length ? " " + j.avisos.join(" ") : "");
    } catch (e) {
      if (!S.items.length) await reserva();
      S.nota = "Não consegui consultar o PNCP agora. " + (S.items.length ? "Mostrando a última lista salva. " : "") + "Tente de novo em alguns minutos.";
      S.notaErr = true;
    }
    S.buscando = false; render();
  }
  async function reserva(){
    try {
      const j = await (await fetch("editais-base.json")).json();
      S.coleta = {base: j.base, coletadaEm: j.coletadaEm}; S.reserva = true; carregar(j.editais);
    } catch { S.phase = "offline"; }
  }

  const TITULOS = {buscar:["Buscar editais","Editais com prazo aberto coletados do PNCP, com o portal onde a disputa acontece."], salvos:["Salvos","Editais que você guardou para analisar. Ficam salvos neste navegador."], portais:["Portais","Os portais de disputa. Abra qualquer um direto daqui."]};
  function render(){
    document.querySelectorAll("[data-view]").forEach(b => b.dataset.view === S.view ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
    $("pageTitle").textContent = TITULOS[S.view][0]; $("pageText").textContent = TITULOS[S.view][1];
    $("vBuscar").hidden = S.view !== "buscar"; $("vSalvos").hidden = S.view !== "salvos"; $("vPortais").hidden = S.view !== "portais";
    $("cSalvos").textContent = abertos().filter(it => S.star.has(it.id)).length; $("cPortais").textContent = PORTAIS.length;
    renderStatus();
    if (S.view === "buscar") renderBuscar(); else if (S.view === "salvos") renderSalvos(); else renderPortais();
    renderDrawer();
  }
  function abrir(id){ S.lastFocus = document.activeElement; S.sel = id; render(); const c = $("drawer").querySelector("[data-close]"); if (c) c.focus(); }
  function fechar(){ S.sel = null; render(); if (S.lastFocus && document.contains(S.lastFocus)) S.lastFocus.focus(); }

  function carregar(docs){
    const ref = toDate(S.coleta && S.coleta.coletadaEm) || new Date();
    S.items = docs.map(d => {
      const it = Object.assign({}, d);
      it.prazo = toDate(d.prazo);
      it.pub = d.publicacao ? toDate(d.publicacao.length === 10 ? d.publicacao + "T12:00:00" : d.publicacao) : null;
      it.novo = !!it.pub && ref - it.pub <= 2 * DIA;
      it.busca = norm([d.orgao, d.unidade, d.objeto, d.edital, d.processo, d.municipio, d.uf, d.modalidade, d.fonte, d.uasg].join(" "));
      return it;
    });
    S.phase = "ready";
    render();
  }

  $("sugest").insertAdjacentHTML("beforeend", ["hemodiálise","plantão","credenciamento","urgência","UTI"].map(t => '<button type="button" data-sug="' + esc(t) + '">' + esc(t) + "</button>").join(""));

  document.addEventListener("click", ev => {
    const v = ev.target.closest("[data-view]"); if (v) { S.view = v.dataset.view; try { history.replaceState(null, "", "#" + S.view); } catch {} return render(); }
    const st = ev.target.closest("[data-star]");
    if (st) { const id = st.dataset.star; S.star.has(id) ? S.star.delete(id) : S.star.add(id); store.set("rl_star_real", [...S.star]); return render(); }
    if (ev.target.closest("[data-stop]")) return;
    const dc = ev.target.closest("[data-docs]"); if (dc) { carregarDocs(dc.dataset.docs); return renderDrawer(); }
    const op = ev.target.closest("[data-open]"); if (op) return abrir(op.dataset.open);
    const tira = ev.target.closest("[data-tira]");
    if (tira) { const k = tira.dataset.tira; if (k === "fonte") S.fonte = ""; else { F[k] = ""; if (k === "uf") F.mun = ""; } return render(); }
    const f = ev.target.closest("[data-fonte]"); if (f) { S.fonte = f.dataset.fonte; return render(); }
    const sg = ev.target.closest("[data-sug]"); if (sg) { $("q").value = sg.dataset.sug; return render(); }
    if (ev.target.closest("[data-close]") || ev.target.id === "shade") return fechar();
    const r = ev.target.closest("[data-row]"); if (r) return abrir(r.dataset.row);
  });
  document.addEventListener("change", ev => {
    const c = ev.target.closest("[data-ck]"); if (!c || !S.sel) return;
    const arr = new Set(S.checks[S.sel] || []); c.checked ? arr.add(+c.dataset.ck) : arr.delete(+c.dataset.ck);
    S.checks[S.sel] = [...arr]; store.set("rl_checks_real", S.checks);
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape" && S.sel) return fechar();
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches && ev.target.matches("[data-row]")) { ev.preventDefault(); abrir(ev.target.dataset.row); }
  });
  $("form").addEventListener("submit", e => { e.preventDefault(); render(); });
  $("q").addEventListener("input", render);
  $("ord").addEventListener("change", render);
  [["fTema","tema"],["fUf","uf"],["fMun","mun"],["fMod","mod"]].forEach(([id,k]) => $(id).addEventListener("change", () => {
    F[k] = $(id).value;
    if (k === "uf" && F.mun && F.mun.split("|")[0] !== F.uf) F.mun = "";
    if (k === "mun" && F.mun) F.uf = F.mun.split("|")[0];
    render();
  }));
  $("limpar").addEventListener("click", () => { F.tema = F.uf = F.mun = F.mod = ""; S.fonte = ""; $("q").value = ""; ["fTema","fUf","fMun","fMod"].forEach(id => $(id).value = ""); render(); });
  $("btnAtualizar").addEventListener("click", () => buscar(true));
  setInterval(renderStatus, 60000);
  render();

  // Mostra a última lista salva na hora e busca a versão nova em seguida
  reserva().then(() => { render(); buscar(false); });
})();
</script>
</body>
</html>
